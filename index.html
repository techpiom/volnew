<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    </style>
  </head>
  <body>
      <nav class="bg-[#F8FAFC] w-full shadow-sm border-b border-gray-200 relative z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    
    <div class="flex items-center cursor-pointer">
      <span class="text-[#1A2B48] text-2xl font-bold tracking-tight uppercase" style="font-family: 'Montserrat', sans-serif;">
        Volkind
      </span>
    </div>

    <div class="hidden md:flex space-x-8 items-center" style="font-family: 'Inter', sans-serif;">
      <a href="#home" class="text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">Home</a>
      <a href="#about" class="text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">About Us</a>
      <a href="#testimony" class="text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">Clinical Testimony</a>
      <a href="#contact" class="text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">Contact Us</a>
      
      <a href="#signup" class="bg-[#B22222] text-white px-6 py-2 rounded-md font-bold shadow-md hover:bg-[#8c1a1a] transition-colors duration-200" style="font-family: 'Montserrat', sans-serif;">
        Sign Up
      </a>
    </div>

    <div class="md:hidden flex items-center">
      <button id="mobile-menu-btn" class="text-[#1A2B48] hover:text-[#B22222] focus:outline-none transition-colors duration-200">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path id="menu-icon-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          <path id="menu-icon-close" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

  </div>

  <div id="mobile-menu" class="hidden md:hidden bg-[#F8FAFC] border-t border-gray-200 absolute w-full shadow-md">
    <div class="px-6 py-4 flex flex-col space-y-4" style="font-family: 'Inter', sans-serif;">
      <a href="#home" class="block text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">Home</a>
      <a href="#about" class="block text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">About Us</a>
      <a href="#testimony" class="block text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">Clinical Testimony</a>
      <a href="#contact" class="block text-[#334155] hover:text-[#B22222] font-medium transition-colors duration-200">Contact Us</a>
      
      <a href="#signup" class="block text-center bg-[#B22222] text-white px-6 py-3 mt-2 rounded-md font-bold shadow-md hover:bg-[#8c1a1a] transition-colors duration-200" style="font-family: 'Montserrat', sans-serif;">
        Sign Up
      </a>
    </div>
  </div>
</nav>

<script>
  const btn = document.getElementById('mobile-menu-btn');
  const menu = document.getElementById('mobile-menu');
  const iconOpen = document.getElementById('menu-icon-open');
  const iconClose = document.getElementById('menu-icon-close');

  btn.addEventListener('click', () => {
    // Toggle the menu visibility
    menu.classList.toggle('hidden');
    
    // Toggle the hamburger and X icons
    iconOpen.classList.toggle('hidden');
    iconClose.classList.toggle('hidden');
  });
</script>
      
  </body>
</html>
